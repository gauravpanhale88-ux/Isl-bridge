<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const $=s=>document.querySelector(s);
const video=$('#video'), canvas=$('#overlay'), ctx=canvas.getContext('2d');

const signs=[
 {key:'hello',en:'Hello',hi:'नमस्ते',mr:'नमस्कार',hint:'Open palm'},
 {key:'yes',en:'Yes',hi:'हाँ',mr:'हो',hint:'Fist / repeated nod-like hand motion'},
 {key:'no',en:'No',hi:'नहीं',mr:'नाही',hint:'Index + middle fingers'},
 {key:'thankyou',en:'Thank you',hi:'धन्यवाद',mr:'धन्यवाद',hint:'Open hand moving forward'},
 {key:'iloveyou',en:'I love you',hi:'मैं तुमसे प्यार करता/करती हूँ',mr:'मला तुझ्यावर प्रेम आहे',hint:'Thumb, index and little finger raised'},
 {key:'help',en:'Help',hi:'मदद',mr:'मदत',hint:'Open palm gesture'},
 {key:'please',en:'Please',hi:'कृपया',mr:'कृपया',hint:'Flat hand / circular motion'}
];

let stream=null, camera=null, hands=null, autoDetect=false, practiceTarget=null;
let facingMode='user', cameraRunning=false;

function langText(s){return s[$('#lang').value==='hi-IN'?'hi':$('#lang').value==='mr-IN'?'mr':'en']}
function setOutput(s,conf='Detected sign'){ 
  $('#output').textContent=langText(s); 
  $('#confidence').textContent=conf; 
  $('#output').dataset.key=s.key;
  if($('#autoSpeak').checked) speak($('#output').textContent); 
}

function speak(t){ 
  if(!('speechSynthesis' in window)){alert('Speech synthesis is not supported in this browser.');return} 
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(t);
  u.lang=$('#lang').value;
  u.rate=+$('#rate').value;
  speechSynthesis.speak(u);
}

$('#speak').onclick=()=>speak($('#output').textContent==='—'?'':$('#output').textContent);
$('#manualSpeak').onclick=()=>speak($('#manual').value);
$('#copy').onclick=async()=>{await navigator.clipboard.writeText($('#output').textContent);$('#confidence').textContent='Copied to clipboard';};
$('#clear').onclick=()=>{$('#output').textContent='—';$('#confidence').textContent='Waiting for a sign…'};
$('#save').onclick=()=>{
  let t=$('#output').textContent;if(t==='—')return;
  let h=JSON.parse(localStorage.getItem('islHistory')||'[]');
  h.unshift({text:t,time:new Date().toLocaleString()});
  localStorage.setItem('islHistory',JSON.stringify(h.slice(0,100)));
  renderHistory();
};
$('#clearHistory').onclick=()=>{localStorage.removeItem('islHistory');renderHistory()};

function renderHistory(){
  let h=JSON.parse(localStorage.getItem('islHistory')||'[]');
  $('#historyList').innerHTML=h.length?h.map(x=>`<div class="historyItem"><b>${escapeHtml(x.text)}</b><div class="mini">${escapeHtml(x.time)}</div></div>`).join(''):'<div class="empty">No saved translations yet.</div>';
}
function escapeHtml(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderDict(){ 
  $('#dict').innerHTML=signs.map(s=>`<div class="dictItem"><span class="badge">${escapeHtml(s.en)}</span> <b>${escapeHtml(langText(s))}</b><div class="mini">${escapeHtml(s.hint)}</div></div>`).join('');
  $('#target').innerHTML=signs.map(s=>`<option value="${s.key}">${escapeHtml(s.en)}</option>`).join('');
}
renderHistory();renderDict();

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  $('#'+b.dataset.tab).classList.add('active');
});
$('#theme').onclick=()=>document.body.classList.toggle('dark');

function setCameraStatus(message, type='info'){
 const box=$('#permissionBox');
 box.textContent=message;
 box.style.background=type==='error'?'#fff0f2':type==='good'?'#eaf8f1':'#f1f3f8';
 box.style.color=type==='error'?'#b52d3d':type==='good'?'#14764e':'#5d6677';
}

function secureCameraCheck(){
 if(!window.isSecureContext){
   setCameraStatus('❌ Camera requires HTTPS or localhost. This file was opened directly, so Chrome may block the camera.','error');
   return false;
 }
 if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
   setCameraStatus('❌ This browser does not provide camera access. Please use an updated Chrome/Edge browser.','error');
   return false;
 }
 return true;
}

async function checkCameraPermission(){
 if(!secureCameraCheck()) return;
 try{
   if(navigator.permissions?.query){
     const p=await navigator.permissions.query({name:'camera'});
     if(p.state==='denied') setCameraStatus('❌ Camera permission is blocked. Open Chrome site permissions and set Camera → Allow.','error');
     else if(p.state==='granted') setCameraStatus('✓ Camera permission is already allowed. Press Start camera.','good');
     else setCameraStatus('Camera permission is ready. Press Start camera and choose Allow.','info');
     p.onchange=()=>checkCameraPermission();
   }else setCameraStatus('Press Start camera and choose Allow when Chrome asks.','info');
 }catch(e){setCameraStatus('Press Start camera and choose Allow when Chrome asks.','info')}
}

// MediaPipe Hands Model Initialization
function initHandsModel(){
  hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
  });
  hands.onResults(onHandResults);
}

function classifyGesture(landmarks){
  const isUp = (tip, pip) => landmarks[tip].y < landmarks[pip].y;
  const thumbUp = Math.abs(landmarks[4].x - landmarks[2].x) > 0.08;
  const indexUp = isUp(8, 6);
  const middleUp = isUp(12, 10);
  const ringUp = isUp(16, 14);
  const pinkyUp = isUp(20, 18);

  // 1. Open Palm (Hello)
  if (indexUp && middleUp && ringUp && pinkyUp) return 'hello';
  // 2. Fist (Yes)
  if (!indexUp && !middleUp && !ringUp && !pinkyUp) return 'yes';
  // 3. Index + Middle (No / Victory)
  if (indexUp && middleUp && !ringUp && !pinkyUp) return 'no';
  // 4. I Love You (Thumb + Index + Pinky)
  if (thumbUp && indexUp && !middleUp && !ringUp && pinkyUp) return 'iloveyou';

  return null;
}

function onHandResults(results){
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const landmarks = results.multiHandLandmarks[0];
    if ($('#drawLandmarks').checked) {
      drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#5b5ce2', lineWidth: 4});
      drawLandmarks(ctx, landmarks, {color: '#ffffff', lineWidth: 2, radius: 3});
    }

    if (autoDetect) {
      const detectedKey = classifyGesture(landmarks);
      if (detectedKey) {
        const found = signs.find(s => s.key === detectedKey);
        if (found) {
          setOutput(found, 'Detected with ~85% confidence');
          if (practiceTarget) {
            if (practiceTarget === detectedKey) {
              $('#practiceFeedback').textContent = '✓ Correct sign!';
              $('#practiceFeedback').style.color = 'green';
            } else {
              $('#practiceFeedback').textContent = 'Try again...';
              $('#practiceFeedback').style.color = 'red';
            }
          }
        }
      }
    }
  }
  ctx.restore();
}

async function startCamera(){
 if(!secureCameraCheck()) return;
 try{
   if(stream) stopCamera();
   setCameraStatus('Requesting camera permission…');
   stream=await navigator.mediaDevices.getUserMedia({
     audio:false,
     video:{facingMode:{ideal:facingMode},width:{ideal:1280,min:640},height:{ideal:720,min:360}}
   });
   video.srcObject=stream;
   await video.play();
   cameraRunning=true;
   $('#cameraStatus').textContent='Camera on';
   setCameraStatus('✓ Camera is working. Your video is visible above.','good');
 }catch(e){
   cameraRunning=false;
   let msg='❌ Camera could not start.';
   if(e.name==='NotAllowedError'||e.name==='PermissionDeniedError')
     msg='❌ Camera permission was denied. In Chrome: site icon → Permissions → Camera → Allow, then try again.';
   else if(e.name==='NotFoundError')
     msg='❌ No camera was found on this device.';
   else if(e.name==='NotReadableError')
     msg='❌ Camera is busy in another app. Close other camera/video apps and try again.';
   else if(e.name==='SecurityError')
     msg='❌ Browser security blocked camera access. Use the HTTPS version of this website.';
   else if(e.name==='OverconstrainedError'){
     facingMode=facingMode==='user'?'environment':'user';
     msg='Camera settings were not supported. Press Start camera again.';
   }
   setCameraStatus(msg,'error');
 }
}

function stopCamera(){
 if(camera){try{camera.stop()}catch(e){} camera=null}
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 video.srcObject=null;
 cameraRunning=false;
 $('#cameraStatus').textContent='Camera off';
 setCameraStatus('Camera stopped. Press Start camera to use it.');
}

async function switchCamera(){
 if(!secureCameraCheck()) return;
 facingMode=facingMode==='user'?'environment':'user';
 if(cameraRunning) await startCamera();
 else setCameraStatus(`Ready for ${facingMode==='user'?'front':'back'} camera. Press Start camera.`);
}

$('#start').onclick=startCamera;
$('#switchCam').onclick=switchCamera;
$('#stop').onclick=stopCamera;
checkCameraPermission();
initHandsModel();

$('#detect').onclick=async()=>{
 if(!stream) await startCamera();
 if(!stream) return;
 if(!hands){setCameraStatus('❌ Hand tracking library could not load.','error');return}
 if(!camera){
   camera=new Camera(video,{
     onFrame:async()=>{if(video.readyState>=2) await hands.send({image:video})},
     width:1280,height:720
   });
   camera.start();
 }
 autoDetect=true;
 $('#confidence').textContent='Hand tracking active… Show hand clearly.';
};

$('#practiceStart').onclick=()=>{
 practiceTarget=$('#target').value;
 let s=signs.find(x=>x.key===practiceTarget);
 $('#practicePrompt').textContent=`Show: ${s.en} (${langText(s)})`;
 $('#practiceFeedback').textContent='Start camera and make the sign.';
 document.querySelector('[data-tab="translate"]').click();
 $('#detect').click();
};

window.addEventListener('beforeunload',stopCamera);
</script>
